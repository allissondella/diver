<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" class="diver-svg">
  <!-- bolhas saindo do snorkel -->
  <g class="d-bolhas" fill="none" stroke="#5EEAD4" stroke-width="3">
    <circle cx="206" cy="18" r="6"/><circle cx="216" cy="-2" r="4"/><circle cx="200" cy="-16" r="3"/>
  </g>
  <!-- nadadeiras -->
  <g class="d-pes" stroke="#06172D" stroke-width="5" stroke-linejoin="round">
    <path d="M86,212 L62,252 Q58,264 72,264 L100,264 Q112,264 108,252 L106,212 Z" fill="#FACC15"/>
    <path d="M154,212 L178,252 Q182,264 168,264 L140,264 Q128,264 132,252 L134,212 Z" fill="#FACC15"/>
    <path d="M76,246 L100,246 M140,246 L164,246" stroke="#C99A0B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- braços -->
  <g class="d-bracos" fill="#15406B" stroke="#5EEAD4" stroke-width="7" stroke-linejoin="round">
    <path class="d-braco-esq" d="M50,150 Q20,170 26,200 Q36,208 46,198 Q46,178 58,168 Z"/>
    <path class="d-braco-dir" d="M190,150 Q220,170 214,200 Q204,208 194,198 Q194,178 182,168 Z"/>
  </g>
  <!-- corpo + capuz da roupa de mergulho (uma peça só, como o fantasma) -->
  <path d="M120,30 C68,30 44,70 42,118 L40,176 C40,202 60,222 88,222 L152,222 C180,222 200,202 200,176 L198,118 C196,70 172,30 120,30 Z" fill="#15406B" stroke="#5EEAD4" stroke-width="8" stroke-linejoin="round"/>
  <!-- faixa turquesa no peito -->
  <path d="M60,196 Q120,214 180,196" fill="none" stroke="#14B8A6" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <!-- rosto (abertura do capuz) -->
  <path d="M70,104 Q70,74 120,74 Q170,74 170,104 L170,150 Q170,194 120,196 Q70,194 70,150 Z" fill="#F2B28C"/>
  <!-- barba -->
  <path d="M70,138 Q72,196 120,198 Q168,196 170,138 Q164,168 142,170 L98,170 Q76,168 70,138 Z" fill="#7A4630"/>
  <!-- bochechas (só no "feliz") -->
  <g class="d-bochechas" fill="#FB7185" opacity=".55"><circle cx="80" cy="152" r="7"/><circle cx="160" cy="152" r="7"/></g>
  <!-- tira da máscara atravessando o capuz -->
  <path d="M46,112 L194,112" stroke="#06172D" stroke-width="10"/>
  <!-- máscara de mergulho -->
  <rect x="56" y="84" width="128" height="58" rx="27" fill="#0C354C" stroke="#FACC15" stroke-width="8"/>
  <path d="M72,98 L86,92" stroke="#E6F1FF" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <!-- olhos: normal -->
  <g class="d-olhos d-olhos--normal">
    <g class="d-olho"><circle cx="96" cy="114" r="15" fill="#E6F1FF"/><circle class="d-pupila" cx="94" cy="117" r="7.5" fill="#0B2545"/></g>
    <g class="d-olho"><circle cx="144" cy="114" r="15" fill="#E6F1FF"/><circle class="d-pupila" cx="142" cy="117" r="7.5" fill="#0B2545"/></g>
  </g>
  <!-- olhos: feliz (^ ^) -->
  <g class="d-olhos d-olhos--feliz" fill="none" stroke="#E6F1FF" stroke-width="6" stroke-linecap="round">
    <path d="M84,120 Q96,102 108,120"/><path d="M132,120 Q144,102 156,120"/>
  </g>
  <!-- olhos: triste (pálpebras caídas) -->
  <g class="d-olhos d-olhos--triste">
    <circle cx="96" cy="116" r="14" fill="#E6F1FF"/><circle cx="144" cy="116" r="14" fill="#E6F1FF"/>
    <circle cx="95" cy="121" r="7" fill="#0B2545"/><circle cx="143" cy="121" r="7" fill="#0B2545"/>
    <path d="M80,116 L112,106 L112,98 L80,98 Z" fill="#0C354C"/><path d="M160,116 L128,106 L128,98 L160,98 Z" fill="#0C354C"/>
  </g>
  <!-- olhos: pensando (olhando para cima) -->
  <g class="d-olhos d-olhos--pensando">
    <circle cx="96" cy="114" r="15" fill="#E6F1FF"/><circle cx="144" cy="114" r="15" fill="#E6F1FF"/>
    <circle cx="101" cy="108" r="7.5" fill="#0B2545"/><circle cx="149" cy="108" r="7.5" fill="#0B2545"/>
  </g>
  <!-- snorkel: tubo coral saindo da boca e subindo pelo lado -->
  <path d="M136,166 Q172,168 186,150 Q196,136 196,110 L196,36" fill="none" stroke="#06172D" stroke-width="18" stroke-linecap="round"/>
  <path d="M136,166 Q172,168 186,150 Q196,136 196,110 L196,36" fill="none" stroke="#FB7185" stroke-width="11" stroke-linecap="round"/>
  <rect x="186" y="24" width="20" height="16" rx="5" fill="#FACC15" stroke="#06172D" stroke-width="4"/>
  <!-- bigode pequeno, sem contorno, da cor da barba (fica atrás do bocal) -->
  <path d="M95.8,161.5 Q98.6,147.5 111.2,148.9 Q118.2,150.3 121,153.1 Q123.8,150.3 130.8,148.9 Q143.4,147.5 146.2,161.5 Q135,155.9 121,158.7 Q107,155.9 95.8,161.5 Z" fill="#7A4630"/>
  <!-- bocal na boca -->
  <rect x="100" y="156" width="42" height="20" rx="10" fill="#FACC15" stroke="#06172D" stroke-width="4"/>
  <path d="M108,166 L134,166" stroke="#C99A0B" stroke-width="4" stroke-linecap="round"/>
</svg>
